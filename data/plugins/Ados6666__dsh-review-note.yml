name: Ados6666/dsh-review-note
category: workflow
description:
  en: 'Annotatable checkpoint reviews: highlight any passage of a delivered document, comment on each decision point, and return one structured note; an ordinary ask_user_question, single question or batch, becomes one annotatable sheet.'
  zh: '给阶段交付做可批注的验收单：在正文上划词、逐条写意见，一次回传结构化结果；普通 ask_user_question（单题或成批）都合并成一屏可批注的确认单。'
